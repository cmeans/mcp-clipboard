name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  validate-server-json:
    # Closes #114. Release-time backstop in case the registry schema or
    # publisher version changes between PR-merge and tag-push. ci.yml runs
    # the same check on every PR. Gating publish-pypi on this prevents the
    # half-publish failure mode where PyPI accepts a release (irreversible
    # on a per-version basis) but the registry leg fails on schema drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-mcp-publisher
      - name: Validate server.json against registry schema
        run: ./mcp-publisher validate server.json

  publish-pypi:
    needs: [build, validate-server-json]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-registry:
    # Publish (or update) the server entry in the official MCP registry.
    # Runs after publish-pypi because the registry validates that the
    # referenced PyPI package+version exists before accepting the entry.
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-mcp-publisher

      - name: Authenticate to MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to MCP registry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Idempotent: the registry rejects re-publishing an existing
          # version (anchored to upstream ErrInvalidVersion in
          # internal/database/database.go). Re-running a partially-failed
          # tag should treat duplicate-version as a no-op rather than crash.
          # If the upstream error text changes, this falls through to
          # `exit $status` and fails loudly — preferable to silently
          # swallowing a real publish error.
          set +e
          output=$(./mcp-publisher publish 2>&1)
          status=$?
          echo "$output"
          if [ $status -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qF 'cannot publish duplicate version'; then
            echo "::warning::Version $TAG already exists in MCP registry — treating as no-op"
            exit 0
          fi
          exit $status

  github-release:
    # Auto-create (or update) a GitHub Release matching the tag, with notes
    # pulled from CHANGELOG.md. Closes #126. The Releases page is the
    # canonical surface most users discover the project through; without
    # this job it drifts behind tags / PyPI / MCP-registry state. Pattern
    # ported from cmeans/mcp-synology publish.yml.
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # CHANGELOG.md is the authoritative release narrative. Extract the
          # section for the current tag and use it as the Release body so we
          # don't duplicate content or rely on low-quality auto-generated
          # commit lists. Falls back to --generate-notes if the CHANGELOG
          # has no matching entry (e.g. an emergency tag without doc prep).
          VERSION="${TAG#v}"
          # mcp-clipboard CHANGELOG uses Keep-a-Changelog format:
          # `## [2.5.1] - 2026-05-05`. The literal `[VERSION]` headings
          # distinguish actual releases from `## [Unreleased]` (also a
          # bracketed heading but the version-string never matches).
          awk -v version="$VERSION" '
            $0 ~ "^## \\["version"\\]" {flag=1; next}
            flag && /^## / {exit}
            flag
          ' CHANGELOG.md > release_notes.md

          # Strip leading blank lines so the body does not start with an
          # empty paragraph.
          sed -i '/./,$!d' release_notes.md

          if [ -s release_notes.md ]; then
            echo "Found CHANGELOG entry for $VERSION ($(wc -l < release_notes.md) lines)"
            echo "use_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CHANGELOG entry for $VERSION — falling back to auto-generated notes"
            echo "use_changelog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          USE_CHANGELOG: ${{ steps.notes.outputs.use_changelog }}
        run: |
          # Idempotent: if a release for the tag already exists (e.g. it was
          # hand-crafted before the publish workflow ran, or the workflow is
          # being re-run after a partial failure), update its notes in place
          # with `gh release edit` rather than failing with a 422.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating notes in place"
            if [ "$USE_CHANGELOG" = "true" ]; then
              gh release edit "$TAG" --title "$TAG" --notes-file release_notes.md
            else
              # Cannot regenerate auto notes on edit — leave existing body.
              gh release edit "$TAG" --title "$TAG"
            fi
          else
            echo "Creating new release $TAG"
            if [ "$USE_CHANGELOG" = "true" ]; then
              gh release create "$TAG" --title "$TAG" --notes-file release_notes.md
            else
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          fi
