name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Mypy
        run: uv run mypy src/mcp_clipboard/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Run all matrix cells even when one fails so a single-platform issue
      # does not mask the others. Per ci-clipboard-windows-strategy
      # awareness note (2026-05-09): GH Actions matrix is the recommended
      # path because windows-latest and macos-latest are free for public
      # repos and have real session/window servers. Linux runners are
      # headless; integration-x11 below uses xvfb-run for the Linux
      # clipboard path while the unit tests here stay platform-agnostic
      # by mocking the backend.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-windows:
    # Closes the QEMU manual-test loop. The pywin32 Win32 clipboard backend
    # in clipboard_win32.py is exercisable directly on a windows-latest
    # runner -- real Windows Server 2025 with a real session and a real
    # clipboard, no virtualization indirection. Per-push integration coverage
    # for text/plain (with non-ASCII), text/html, text/rtf, image/svg+xml,
    # multi-format atomic writes, and list_formats. The tests in
    # tests/test_clipboard_win32_integration.py self-skip on non-Windows so
    # they're harmless on local Linux pytest runs; this job is the place
    # they actually exercise a clipboard.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Win32 clipboard integration tests
        run: uv run pytest tests/test_clipboard_win32_integration.py -m integration -v

  integration-x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install Xvfb and xclip
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip

      - name: Run X11 integration tests under Xvfb
        env:
          MCP_CLIPBOARD_BACKEND: x11
        run: xvfb-run -a uv run pytest tests/test_integration_x11.py -m integration -v

  version-sync:
    # Closes #114. server.json carries two version fields (top-level and
    # packages[0]) that have to match pyproject.toml. The sync script is
    # the single source of truth; this gate fails PRs that bump
    # pyproject.toml without re-running it. Stdlib-only, no `uv sync`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify server.json matches pyproject.toml
        run: python scripts/sync-server-json.py --check

  validate-server-json:
    # Closes #114. Validate server.json against the MCP registry schema
    # using the same pinned mcp-publisher version that release-time uses.
    # Catches schema drift (new required fields, type changes) at PR time
    # rather than at tag-push time, preventing the half-published failure
    # mode where PyPI accepts a release but the registry leg fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-mcp-publisher
      - name: Validate server.json against registry schema
        run: ./mcp-publisher validate server.json
